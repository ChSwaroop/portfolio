    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      content="Chitturi Swaroop, full stack developer and Software Engineer I at Deeptaai. React and TypeScript frontends, Go microservices, and LLM features (RAG, AI agents) for fast, data-heavy products."

    <meta name="theme-color" content="#eef0ee" />

    <meta property="og:type" content="website" />
    <script>
      // Apply the saved theme before first paint (light by default) to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('theme') || '{}').state;
        var t = (saved && saved.theme) || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.className = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
